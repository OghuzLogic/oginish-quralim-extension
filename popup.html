<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ئۆگىنىش قۇرالىم</title>
  <style>
    :root {
      --primary: #22303C;
      --primary-hover: #1A252F;
      --secondary: #8E4A36;
      --secondary-hover: #773C2B;
      --bg: #F4EFE6;
      --surface: #EAE2D3;
      --surface-hover: #E1D6C3;
      --text-primary: #2B2623;
      --text-muted: #635A52;
      --border: #D5CBB8;
      --success: #4A6B53;
      --error: #A63A3A;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 7px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 400px;
      min-height: 540px;
      max-height: 600px;
      direction: rtl;
      text-align: right;
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: 'UKIJ Tuz', 'Alkatip Tor', 'Segoe UI', Tahoma, system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.65;
      overflow-x: hidden;
    }

    .app-shell {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 540px;
    }

    /* Wireframe Header Box */
    .header-box {
      border: 1px solid var(--border);
      background-color: var(--surface);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      flex: 1;
      text-align: center;
      letter-spacing: 0.01em;
    }

    .back-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--primary);
      border-radius: var(--radius-sm);
      padding: 4px 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 150ms ease, color 150ms ease;
    }

    .back-btn:hover {
      background-color: var(--primary);
      color: var(--bg);
    }

    .hidden {
      display: none !important;
    }

    /* Toast feedback */
    .toast {
      border-radius: var(--radius-md);
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
      transition: opacity 150ms ease;
    }

    .toast.success {
      background-color: #E5EFE7;
      border-color: var(--success);
      color: #2B4532;
    }

    .toast.error {
      background-color: #F6E5E5;
      border-color: var(--error);
      color: #7D2626;
    }

    /* Wireframe Main Book List Container */
    .books-panel {
      border: 1px solid var(--border);
      background-color: var(--surface);
      border-radius: var(--radius-lg);
      padding: 12px;
      min-height: 250px;
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .books-header-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 8px 4px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
    }

    .book-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border-radius: var(--radius-md);
      background-color: var(--bg);
      border: 1px solid var(--border);
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .book-row:hover {
      border-color: var(--primary);
    }

    .book-main-btn {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      text-align: right;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      color: var(--text-primary);
    }

    .book-title-line {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .book-meta-line {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .book-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .row-action-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px 8px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-primary);
      transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
    }

    .row-action-btn.save:hover {
      background-color: var(--primary);
      border-color: var(--primary);
      color: var(--bg);
    }

    .row-action-btn.delete {
      color: var(--error);
      border-color: #DFC3C3;
    }

    .row-action-btn.delete:hover {
      background-color: var(--error);
      border-color: var(--error);
      color: #FFFFFF;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 12px;
      color: var(--text-muted);
      gap: 8px;
    }

    /* Wireframe 4 Full-Width Action Buttons */
    .main-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, transform 120ms ease;
      text-align: center;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--bg);
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--secondary);
      color: var(--bg);
      border-color: var(--secondary);
    }

    .btn-secondary:hover {
      background-color: var(--secondary-hover);
    }

    .btn-surface {
      background-color: var(--surface);
      color: var(--text-primary);
      border-color: var(--border);
    }

    .btn-surface:hover {
      background-color: var(--surface-hover);
      border-color: var(--primary);
    }

    .btn-success {
      background-color: var(--success);
      color: #FFFFFF;
      border-color: var(--success);
    }

    .btn-danger-outline {
      background-color: transparent;
      color: var(--error);
      border-color: var(--error);
    }

    /* Subviews */
    .panel {
      border: 1px solid var(--border);
      background-color: var(--surface);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .input-text, .input-textarea, .input-select {
      width: 100%;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-primary);
    }

    .input-textarea {
      min-height: 120px;
      resize: vertical;
      direction: ltr;
      text-align: left;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
    }

    .file-input {
      width: 100%;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Study Flashcard View */
    .study-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .filter-bar {
      display: flex;
      gap: 6px;
    }

    .filter-btn {
      flex: 1;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-btn.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: var(--bg);
    }

    .qa-card {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 185px;
    }

    .qa-question {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.7;
    }

    .qa-hint {
      font-size: 12px;
      color: var(--secondary);
      padding-top: 6px;
      border-top: 1px dashed var(--border);
    }

    .qa-answer {
      font-size: 14px;
      color: var(--text-primary);
      padding-top: 10px;
      border-top: 1px solid var(--border);
      line-height: 1.75;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    /* Settings */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    .setting-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .setting-desc {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Dhikr View */
    .dhikr-arabic {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      line-height: 1.8;
    }

    .dhikr-uyghur {
      font-size: 14px;
      font-weight: 700;
      color: var(--secondary);
      text-align: center;
    }

    .dhikr-meaning {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    .dhikr-tap-btn {
      width: 124px;
      height: 124px;
      margin: 6px auto;
      border-radius: 50%;
      background-color: var(--primary);
      color: var(--bg);
      border: 3px solid var(--secondary);
      font-family: inherit;
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 120ms ease, background-color 150ms ease;
    }

    .dhikr-tap-btn:hover {
      background-color: var(--primary-hover);
    }

    .dhikr-tap-btn:active {
      transform: scale(0.96);
    }

    .dhikr-target-sub {
      font-size: 11px;
      opacity: 0.85;
      font-weight: 400;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background-color: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--success);
      transition: width 200ms ease;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Top Header Box (Wireframe: قورال ئىسمى) -->
    <header class="header-box">
      <button id="btn-back" type="button" class="back-btn hidden">قايتىش</button>
      <h1 id="header-title" class="header-title">ئۆگىنىش قۇرالىم</h1>
      <span id="header-spacer" class="hidden" style="width: 48px;"></span>
    </header>

    <!-- Dynamic Status Notification -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <!-- VIEW 1: Home (Wireframe Main Screen) -->
    <main id="view-home">
      <section class="books-panel" aria-label="ساقلانغان كىتابلار">
        <div class="books-header-meta">
          <span>ساقلانغان كىتابلار</span>
          <span id="books-count-label">0 كىتاب</span>
        </div>
        <div id="books-list"></div>
      </section>

      <nav class="main-actions" aria-label="ئاساسىي مەشغۇلاتلار" style="margin-top: 12px;">
        <button id="btn-open-add" type="button" class="btn btn-primary">كىتاب قوشۇش</button>
        <button id="btn-copy-prompt" type="button" class="btn btn-secondary">پرومپىتى كۆچۈرۈش</button>
        <button id="btn-open-settings" type="button" class="btn btn-surface">تەڭشەك</button>
        <button id="btn-open-dhikr" type="button" class="btn btn-surface">زىكىر</button>
      </nav>
    </main>

    <!-- VIEW 2: Add Book / Upload JSON -->
    <section id="view-add" class="panel hidden" aria-label="يېڭى كىتاب قوشۇش">
      <div>
        <label class="field-label" for="input-book-title">كىتاب ياكى بىلىم نامى</label>
        <input id="input-book-title" type="text" class="input-text" placeholder="مەسىلەن: ئىلىم ئېلىش ئەدەبلىرى" />
      </div>

      <div>
        <label class="field-label" for="input-json-file">JSON ھۆججىتى يۈكلەش (.json)</label>
        <input id="input-json-file" type="file" accept=".json,application/json" class="file-input" />
      </div>

      <div>
        <label class="field-label" for="input-json-text">ياكى AI چىقىرىپ بەرگەن JSON نى بۇ يەرگە چاپلاڭ</label>
        <textarea id="input-json-text" class="input-textarea" placeholder='{"title": "...", "items": [{"id": 1, "question": "...", "answer": "..."}]}'></textarea>
      </div>

      <div class="btn-row">
        <button id="btn-save-book" type="button" class="btn btn-primary">كىتابنى ساقلاش</button>
      </div>
    </section>

    <!-- VIEW 3: Study Flashcards for Selected Book -->
    <section id="view-study" class="panel hidden" aria-label="سۇئال-جاۋاب ئۆگىنىش">
      <div class="study-meta">
        <span id="study-progress-text">0 / 0 يادلىدىم</span>
        <span id="study-index-text">سۇئال 1 / 1</span>
      </div>
      <div class="progress-track">
        <div id="study-progress-bar" class="progress-fill" style="width: 0%;"></div>
      </div>

      <div class="filter-bar">
        <button id="btn-filter-all" type="button" class="filter-btn active">بارلىق سۇئاللار</button>
        <button id="btn-filter-unmastered" type="button" class="filter-btn">يادلىمىغانلار</button>
        <button id="btn-shuffle-cards" type="button" class="filter-btn">ئارىلاشتۇرۇش</button>
      </div>

      <article class="qa-card">
        <div id="qa-question" class="qa-question"></div>
        <div id="qa-hint" class="qa-hint hidden"></div>
        <div id="qa-answer" class="qa-answer hidden"></div>
      </article>

      <div class="btn-row">
        <button id="btn-toggle-hint" type="button" class="btn btn-surface">يىپ ئۇچى</button>
        <button id="btn-reveal-answer" type="button" class="btn btn-secondary">جاۋابنى كۆرۈش</button>
      </div>

      <div class="btn-row">
        <button id="btn-mark-mastered" type="button" class="btn btn-success">يادلىدىم</button>
        <button id="btn-mark-review" type="button" class="btn btn-surface">قايتا كۆرىمەن</button>
      </div>

      <div class="btn-row">
        <button id="btn-prev-card" type="button" class="btn btn-surface">ئالدىنقى</button>
        <button id="btn-next-card" type="button" class="btn btn-primary">كېيىنكى</button>
      </div>
    </section>

    <!-- VIEW 4: Settings -->
    <section id="view-settings" class="panel hidden" aria-label="تەڭشەك">
      <div class="setting-row">
        <div>
          <div class="setting-title">بروسىر ئېچىلغاندا ئەسكەرتىش</div>
          <div class="setting-desc">Chrome ئېچىلغان ھامان بىر سۇئالنى ئەسكەرتىش</div>
        </div>
        <input id="toggle-startup-reminder" type="checkbox" style="width: 18px; height: 18px; accent-color: #22303C;" />
      </div>

      <div>
        <label class="field-label" for="select-periodic-interval">قەرەللىك ئەسكەرتىش ئارىلىقى</label>
        <select id="select-periodic-interval" class="input-select">
          <option value="0">ئېتىك (پەقەت بروسىر ئېچىلغاندا)</option>
          <option value="30">ھەر 30 مىنۇتتا</option>
          <option value="60">ھەر 1 سائەتتە</option>
          <option value="180">ھەر 3 سائەتتە</option>
        </select>
      </div>

      <div>
        <label class="field-label" for="select-reminder-book">ئەسكەرتىش چىقىرىلىدىغان كىتاب</label>
        <select id="select-reminder-book" class="input-select"></select>
      </div>

      <button id="btn-test-notification" type="button" class="btn btn-secondary">ئەسكەرتىشنى ھازىر سىناش</button>
      <button id="btn-export-all" type="button" class="btn btn-surface">بارلىق كىتابلارنى زاپاسلاش (JSON)</button>
    </section>

    <!-- VIEW 5: Dhikr -->
    <section id="view-dhikr" class="panel hidden" aria-label="زىكىر">
      <div>
        <label class="field-label" for="select-dhikr">زىكىر تاللاش</label>
        <select id="select-dhikr" class="input-select"></select>
      </div>

      <div class="qa-card" style="min-height: 110px; justify-content: center;">
        <div id="dhikr-arabic" class="dhikr-arabic"></div>
        <div id="dhikr-uyghur" class="dhikr-uyghur"></div>
        <div id="dhikr-meaning" class="dhikr-meaning"></div>
      </div>

      <button id="btn-dhikr-tap" type="button" class="dhikr-tap-btn" aria-label="زىكىر ساناشتا بېسىڭ">
        <span id="dhikr-current-count">0</span>
        <span id="dhikr-target-label" class="dhikr-target-sub">/ 33</span>
      </button>

      <div class="study-meta">
        <span id="dhikr-total-label">جەمئىي زىكىر: 0</span>
        <button id="btn-dhikr-reset" type="button" class="row-action-btn delete">بۇ زىكىرنى نۆللەش</button>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
